{% set enable_mpi = "ON" if mpi != "nompi" else "OFF" %}
{% set enable_openmp = "ON" if openmp == "on" else "OFF" %}
{% set package_version = (environ.get("HYPRE_VERSION") or "3.1.0").lstrip("v") %}
{% set upstream_git_url = environ.get("HYPRE_GIT_URL") or "https://github.com/hypre-space/hypre.git" %}
{% set upstream_git_rev = environ.get("HYPRE_GIT_REV") or "9dc9e18aed6a945a95f966e57daacfb1c269f6ec" %}

package:
  name: hypre
  version: {{ package_version }}

source:
  git_url: {{ upstream_git_url }}
  git_rev: {{ upstream_git_rev }}

build:
  number: 0
  string: mpi_{{ mpi }}_openmp_{{ openmp }}_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
  skip: true  # [win]
  script_env:
    - HYPRE_ENABLE_MPI={{ enable_mpi }}
    - HYPRE_ENABLE_OPENMP={{ enable_openmp }}

requirements:
  build:
    - {{ compiler("c") }}
    - {{ compiler("cxx") }}
    - cmake
    - make
  host:
    {% if mpi == "openmpi" %}
    - openmpi
    {% elif mpi == "mpich" %}
    - mpich
    {% endif %}
    {% if openmp == "on" %}
    - llvm-openmp  # [osx]
    {% endif %}
  run:
    {% if mpi == "openmpi" %}
    - {{ pin_compatible("openmpi", max_pin="x.x") }}
    {% elif mpi == "mpich" %}
    - {{ pin_compatible("mpich", max_pin="x.x") }}
    {% endif %}
    {% if openmp == "on" %}
    - llvm-openmp  # [osx]
    {% endif %}

about:
  home: https://github.com/hypre-space/hypre
  license: Apache-2.0
  license_file: LICENSE-APACHE
  summary: >
    HYPRE sparse linear solver library built from a pinned upstream git revision.

test:
  commands:
    - test -f "${PREFIX}/include/HYPRE.h"
    - test -f "${PREFIX}/lib/libHYPRE.so"  # [linux]
    - test -f "${PREFIX}/lib/libHYPRE.dylib"  # [osx]
