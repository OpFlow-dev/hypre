name: CI

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/ci.yml"
      - "conda-recipe/**"
      - "README.md"
      - ".gitignore"
  pull_request:
    branches: ["**"]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/ci.yml"
      - "conda-recipe/**"
      - "README.md"
      - ".gitignore"
  workflow_dispatch:

jobs:
  conda-build:
    name: Conda Build (${{ matrix.os }} | mpi=${{ matrix.mpi }}, openmp=${{ matrix.openmp }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        mpi: [nompi, openmpi, mpich]
        openmp: [on, off]

    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: conda-build-env
          auto-update-conda: false
          channels: conda-forge
          channel-priority: strict
          python-version: "3.12"

      - name: Install conda-build
        shell: bash -el {0}
        run: |
          conda install -n conda-build-env -y conda-build

      - name: Render recipe
        shell: bash -el {0}
        env:
          CONDA_BLD_PATH: ${{ runner.temp }}/conda-bld
        run: |
          set -euo pipefail
          variant_json=$(printf '{"mpi":["%s"],"openmp":["%s"]}' "${{ matrix.mpi }}" "${{ matrix.openmp }}")
          conda render conda-recipe \
            --channel conda-forge \
            --override-channels \
            --variants "${variant_json}"

      - name: Build package variant
        shell: bash -el {0}
        env:
          CONDA_BLD_PATH: ${{ runner.temp }}/conda-bld
        run: |
          set -euo pipefail
          variant_json=$(printf '{"mpi":["%s"],"openmp":["%s"]}' "${{ matrix.mpi }}" "${{ matrix.openmp }}")
          conda build conda-recipe \
            --channel conda-forge \
            --override-channels \
            --variants "${variant_json}"
